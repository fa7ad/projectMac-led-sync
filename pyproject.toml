[project]
name = "projectmac-tuya-sync"
version = "0.1.0"
description = "OSC scene-stream to Tuya BLE-beacon lamp bridge, relayed over an ESP32."
requires-python = ">=3.14"
dependencies = [
    "python-osc>=1.9",
    "pyserial>=3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectmac_tuya_sync"]
